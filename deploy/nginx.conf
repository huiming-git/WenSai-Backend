# WenSai Backend - Nginx 反向代理示例
#
# 放置位置：/etc/nginx/sites-available/wensai，然后
#   sudo ln -s /etc/nginx/sites-available/wensai /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.example.com
#
# 替换下面的 server_name 为你的实际域名。

upstream wensai_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    # certbot 会自动填入以下两行
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 论文附件上限（按需调整）
    client_max_body_size 1024m;
    client_body_timeout  300s;

    access_log /var/log/nginx/wensai.access.log;
    error_log  /var/log/nginx/wensai.error.log;

    # 健康检查不写 access 日志
    location = /api/health {
        access_log off;
        proxy_pass http://wensai_api;
    }

    location / {
        proxy_pass         http://wensai_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
